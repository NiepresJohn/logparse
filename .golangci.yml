run:
  timeout: 5m
  go: '1.24'

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - dogsled
    - dupl
    - gocritic
    - gosec
    - prealloc
    - revive
    - whitespace

linters-settings:
  gocyclo:
    min-complexity: 20
  dupl:
    threshold: 100
  gocritic:
    enabled-tags:
      - performance
      - style
      - experimental
    disabled-checks:
      - hugeParam
      - unnamedResult
  revive:
    rules:
      - name: package-comments
        disabled: true
      - name: exported
        disabled: true
      - name: unused-parameter
        disabled: true
      - name: empty-block
        disabled: true
  stylecheck:
    checks:
      - all
      - "-ST1000"
      - "-ST1003"
  prealloc:
    simple: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - gocyclo
        - errcheck
    - path: cmd/
      linters:
        - gocyclo
  exclude-use-default: false
